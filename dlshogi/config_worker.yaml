# lightning.pytorch==2.2.0.post0
seed_everything: 0
trainer:
  max_epochs: 4
  sync_batchnorm: false
  val_check_interval: 0.5
  precision: bf16-mixed
  gradient_clip_val: 10.0
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: -1
        save_on_train_epoch_end: true
        monitor: val/loss
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
model:
  network: exp__bi20x256_relu
  val_lambda: 0.333
  val_lambda_decay_epoch: 3
  use_ema: false
  update_bn: false
  ema_start_epoch: 1
  ema_freq: 250
  ema_decay: 0.9
  lr_scheduler_interval: step
  model_filename: model-{epoch:03}
  use_compile: true
data:
  train_files:
    - cache
  val_files:
    - /work/floodgate.hcpe
  batch_size: 1024
  val_batch_size: 1024
  num_workers: 1
  persistent_workers: true
  use_average: true
  use_evalfix: true
  temperature: 1.0
  cache: /work/cache
optimizer:
  class_path: torch.optim.SGD
  init_args:
    lr: 0.04
    momentum: 0.9
    weight_decay: 0.0001
    nesterov: true
lr_scheduler:
  class_path: dlshogi.lr_scheduler.WarmupStepLR
  init_args:
    step_size: 1662
    gamma: 0.5
    warmup_t: 100
    warmup_lr_init: 1.0e-07
