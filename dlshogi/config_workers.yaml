# lightning.pytorch==2.2.0.post0
seed_everything: 0
trainer:
  devices: 8
  max_epochs: 10
  sync_batchnorm: false
  val_check_interval: 0.125
  precision: bf16-mixed
  gradient_clip_val: 10.0
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: -1
        save_on_train_epoch_end: true
        monitor: val/loss
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
model:
  network: exp__ba20x256_relu
  val_lambda: 0.333
  val_lambda_decay_epoch: 8
  use_ema: false
  update_bn: false
  ema_start_epoch: 8
  ema_freq: 250
  ema_decay: 0.9
  lr_scheduler_interval: step
  model_filename: model-pre68_60x768-{epoch:03}
  use_compile: true
data:
  train_files:
    - /work/hcpe3/floodgate_2019-2026_0131_r3800_brinkmate.hcpe3
  val_files:
    - /work/hcpe3/floodgate.hcpe
  batch_size: 512
  val_batch_size: 512
  num_workers: 1
  persistent_workers: true
  use_average: true
  use_evalfix: true
  temperature: 1.0
  cache: /work/hcpe3/exp0702.cache
optimizer:
  class_path: torch.optim.SGD
  init_args:
    lr: 0.04
    momentum: 0.9
    weight_decay: 0.0001
    nesterov: true
lr_scheduler:
  class_path: dlshogi.lr_scheduler.WarmupStepLR
  init_args:
    step_size: 94878
    gamma: 0.5
    warmup_t: 1000
    warmup_lr_init: 1.0e-07
